[package]
name = "naevc"
version.workspace = true
edition = "2024"
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[features]
# Mirror the meson options of the same names.
paranoid = []
debug_arrays = []
tracy = []

[build-dependencies]
# Windows needs 0.72.1 or it emits a flood of overflow warnings.
bindgen = "0.72.1"
cc = "1.2"
pkg-config = "0.3"
