# The release's LICENSE, sources and headers, unchanged.

[upstream]
project = "http://enet.bespin.org/"
release = "https://github.com/lsalzman/enet/releases/tag/v1.3.18"
tarball = "http://enet.bespin.org/download/enet-1.3.18.tar.gz"
sha256 = "2a8a0c5360d68bb4fcd11f2e4c47c69976e8d2c85b109dd7d60b1181a4f85d36"
commit = "2662c0de09e36f2a2030ccc2c528a3e4c9e8138a"
license = "MIT, in LICENSE"

[build]
library = "enet"
sources = ["."]
include = ["include"]
# What configure finds on Linux, less the gethostby*_r fallbacks that getaddrinfo
# and getnameinfo replace. unix.c sets its own on macOS and is empty on Windows.
defines = [
  "HAS_FCNTL",
  "HAS_GETADDRINFO",
  "HAS_GETNAMEINFO",
  "HAS_INET_NTOP",
  "HAS_INET_PTON",
  "HAS_MSGHDR_FLAGS",
  "HAS_POLL",
  "HAS_SOCKLEN_T",
]

[build.link]
windows = ["winmm", "ws2_32"]
