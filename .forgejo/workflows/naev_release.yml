on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
      - "!v*.*.*-alpha*"
      - "!v*.*.*-beta*"
      - "!v*.*.*-rc*"

name: Release

# CI builds the vendored libraries, as the release packages do, whatever the image has installed.
env:
  NAEV_VENDOR: always

jobs:
  "Package_Source":
    runs-on: naev-release
    steps:
      - name: Force Codeberg over SSH
        run: git config --global url."ssh://git@codeberg.org/naev/".insteadOf https://codeberg.org/naev/

      - name: Checkout Naev Repository
        uses: actions/checkout@v4
        with:
          lfs: false # restore after cache
          path: source
          submodules: true
          ssh-key: ${{ secrets.CODEBERG_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.CODEBERG_SSH_KNOWN_HOSTS }}
          persist-credentials: true

      - name: Capture assets submodule revision
        id: assets_rev
        run: echo "rev=$(git -C source submodule status assets | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore LFS cache
        uses: actions/cache@v5
        with:
          path: |
            source/.git/lfs/objects
            source/.git/modules/assets/lfs/objects
          key: lfs-${{ steps.assets_rev.outputs.rev }}
          restore-keys: lfs-

      - name: Fetch and checkout LFS
        run: |
          git -C source/assets lfs fetch
          git -C source/assets lfs checkout

      - name: Restore Cargo Registry
        uses: actions/cache/restore@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-naev-release

      - name: Package Dist
        run: |
          cd source
          cargo xtask dist --output "${{ github.workspace }}/build/dist"
        env:
          CARGO_HOME: ${{ github.workspace }}/build/cargo-home
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/target

      # One fixed key per platform. The cache server keeps only the newest
      # save of a key, so main refreshes it without piling up copies.
      - name: Save Cargo Registry
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-naev-release

      - name: Collect Artifacts
        run: |
          cp -r source/utils/ci/itch source/utils/ci/steam source/utils/ci/berg build/dist/
          mv build/dist/naev-*.tar.xz build/dist/source.tar.xz
          # The tarball carries the version xtask stamped it with.
          tar -xJOf build/dist/source.tar.xz --wildcards '*/dat/VERSION' > build/dist/VERSION

      # Build outputs pass between jobs through the cache server every
      # runner shares, laid out the way an artifact download placed them.
      - name: Stage naev-dist
        run: |
          mkdir -p "handoff/naev-dist"
          cp -r "build/dist/source.tar.xz" "handoff/naev-dist/"

      - name: Save naev-dist
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-dist
          key: naev-dist-${{ github.run_id }}

      - name: Stage naev-changelog
        run: |
          mkdir -p "handoff/naev-changelog"
          cp -r "build/dist/Changelog.md" "handoff/naev-changelog/"

      - name: Save naev-changelog
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-changelog
          key: naev-changelog-${{ github.run_id }}

      - name: Stage naev-version
        run: |
          mkdir -p "handoff/naev-version"
          cp -r "build/dist/VERSION" "handoff/naev-version/"

      - name: Save naev-version
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-version
          key: naev-version-${{ github.run_id }}

      - name: Stage naev-deployment-assets
        run: |
          mkdir -p "handoff/naev-deployment-assets"
          cp -r "build/dist/berg" "handoff/naev-deployment-assets/"
          cp -r "build/dist/steam" "handoff/naev-deployment-assets/"
          cp -r "build/dist/itch" "handoff/naev-deployment-assets/"

      - name: Save naev-deployment-assets
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-deployment-assets
          key: naev-deployment-assets-${{ github.run_id }}

  "Linux_Naev_Release":
    needs: "Package_Source"
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: naev-steamruntime
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.image }}
    env:
      CARGO_HOME: ${{ github.workspace }}/build/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/target
    steps:
      # The runner's read-only cache credentials override any workflow or job
      # env, but not values a step writes to GITHUB_ENV.
      - name: Use the Trusted Compile Cache
        run: |
          echo "SCCACHE_REDIS_USERNAME=naev-trusted" >> "$GITHUB_ENV"
          echo "SCCACHE_REDIS_PASSWORD=${{ secrets.SCCACHE_TRUSTED_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SCCACHE_REDIS_RW_MODE=READ_WRITE" >> "$GITHUB_ENV"

      - name: Get Source
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-dist
          key: naev-dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Extract Source
        run: |
          mkdir source
          tar -xf handoff/naev-dist/source.tar.xz -C source --strip 1

      - name: Restore Cargo Registry
        uses: actions/cache/restore@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.target }}

      - name: Package
        run: |
          cd source
          cargo xtask package appimage steam --release --output "${{ github.workspace }}/build/staging"

      # One fixed key per platform. The cache server keeps only the newest
      # save of a key, so main refreshes it without piling up copies.
      - name: Save Cargo Registry
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.target }}

      - name: Show sccache Stats
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$RUSTC_WRAPPER" ]; then "$RUSTC_WRAPPER" --show-stats; fi

      - name: Upload Cargo Lock Artifact
        uses: actions/upload-artifact@v3
        with:
          name: naev-${{ matrix.target }}-cargo-lock
          path: ${{ github.workspace }}/source/Cargo.lock
          if-no-files-found: error

      - name: Stage naev-steamruntime
        run: |
          mkdir -p "handoff/naev-steamruntime"
          cp -r "build/staging/naev-steamruntime/naev.x64" "handoff/naev-steamruntime/"

      - name: Save naev-steamruntime
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-steamruntime
          key: naev-steamruntime-${{ github.run_id }}

      - name: Stage naev-ndata
        run: |
          mkdir -p "handoff/naev-ndata"
          cp -r "build/staging/naev-ndata/naev-ndata.tar.xz" "handoff/naev-ndata/"

      - name: Save naev-ndata
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-ndata
          key: naev-ndata-${{ github.run_id }}

      - name: Stage naev-linux-libs
        run: |
          mkdir -p "handoff/naev-linux-libs"
          cp -r build/staging/naev-linux-libs/. "handoff/naev-linux-libs/"

      - name: Save naev-linux-libs
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-linux-libs
          key: naev-linux-libs-${{ github.run_id }}

      - name: Stage naev-linux-x86-64
        run: |
          mkdir -p "handoff/naev-linux-x86-64"
          cp -r build/staging/naev-linux-x86-64/. "handoff/naev-linux-x86-64/"

      - name: Save naev-linux-x86-64
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-linux-x86-64
          key: naev-linux-x86-64-${{ github.run_id }}

  "Windows_Naev_Release":
    needs: "Package_Source"
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: naev-windows
            target: x86_64-pc-windows-gnu

    runs-on: ${{ matrix.image }}
    env:
      CARGO_HOME: ${{ github.workspace }}/build/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/target
    steps:
      # The runner's read-only cache credentials override any workflow or job
      # env, but not values a step writes to GITHUB_ENV.
      - name: Use the Trusted Compile Cache
        run: |
          echo "SCCACHE_REDIS_USERNAME=naev-trusted" >> "$GITHUB_ENV"
          echo "SCCACHE_REDIS_PASSWORD=${{ secrets.SCCACHE_TRUSTED_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SCCACHE_REDIS_RW_MODE=READ_WRITE" >> "$GITHUB_ENV"

      - name: Configure Build Environment
        run: |
          /usr/bin/setup-devenv.sh

      - name: Get Source
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-dist
          key: naev-dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Extract Source
        run: |
          mkdir source
          tar -xf handoff/naev-dist/source.tar.xz -C source --strip 1

      - name: Restore Cargo Registry
        uses: actions/cache/restore@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.target }}

      - name: Package
        run: |
          cd source
          cargo xtask package windows installer --release --output "${{ github.workspace }}/build/staging"

      # One fixed key per platform. The cache server keeps only the newest
      # save of a key, so main refreshes it without piling up copies.
      - name: Save Cargo Registry
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.target }}

      - name: Show sccache Stats
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$RUSTC_WRAPPER" ]; then "$RUSTC_WRAPPER" --show-stats; fi

      - name: Stage naev-win64-installer
        run: |
          mkdir -p "handoff/naev-win64-installer"
          cp -r "build/staging/naev-win64/naev-installer.exe" "handoff/naev-win64-installer/"

      - name: Save naev-win64-installer
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-win64-installer
          key: naev-win64-installer-${{ github.run_id }}

      - name: Stage naev-win64-tarball
        run: |
          mkdir -p "handoff/naev-win64-tarball"
          cp -r "build/staging/naev-win64/naev-windows.tar.xz" "handoff/naev-win64-tarball/"

      - name: Save naev-win64-tarball
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-win64-tarball
          key: naev-win64-tarball-${{ github.run_id }}

  "Darwin_Naev_Release":
    needs: "Package_Source"
    runs-on: naev-macos
    env:
      CARGO_HOME: ${{ github.workspace }}/build/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/target
      BUILDARCH: "x86_64"
    steps:
      # The runner's read-only cache credentials override any workflow or job
      # env, but not values a step writes to GITHUB_ENV.
      - name: Use the Trusted Compile Cache
        run: |
          echo "SCCACHE_REDIS_USERNAME=naev-trusted" >> "$GITHUB_ENV"
          echo "SCCACHE_REDIS_PASSWORD=${{ secrets.SCCACHE_TRUSTED_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SCCACHE_REDIS_RW_MODE=READ_WRITE" >> "$GITHUB_ENV"

      - name: Configure Build Environment
        run: |
          /usr/bin/setup-devenv.sh

      - name: Get Source
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-dist
          key: naev-dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Extract Source
        run: |
          mkdir source
          tar -xf handoff/naev-dist/source.tar.xz -C source --strip 1

      - name: Restore Cargo Registry
        uses: actions/cache/restore@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-naev-macos

      - name: Package
        run: |
          cd source
          cargo xtask package macos dmg --release --output "${{ github.workspace }}/build/staging"

      # One fixed key per platform. The cache server keeps only the newest
      # save of a key, so main refreshes it without piling up copies.
      - name: Save Cargo Registry
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-naev-macos

      - name: Show sccache Stats
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$RUSTC_WRAPPER" ]; then "$RUSTC_WRAPPER" --show-stats; fi

      - name: Stage naev-macos
        run: |
          mkdir -p "handoff/naev-macos"
          cp -r build/staging/naev-macos/. "handoff/naev-macos/"

      - name: Save naev-macos
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-macos
          key: naev-macos-${{ github.run_id }}

  "Steam_Naev_Soundtrack_Release":
    needs: "Package_Source"
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: naev-steamruntime
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.image }}
    env:
      CARGO_HOME: ${{ github.workspace }}/build/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/target
    steps:
      - name: Get Source
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-dist
          key: naev-dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Extract Source
        run: |
          mkdir source
          tar -xf handoff/naev-dist/source.tar.xz -C source --strip 1

      - name: Restore Cargo Registry
        uses: actions/cache/restore@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.target }}

      - name: Package
        run: |
          cd source
          cargo xtask package soundtrack --output "${{ github.workspace }}/build/staging"

      # One fixed key per platform. The cache server keeps only the newest
      # save of a key, so main refreshes it without piling up copies.
      - name: Save Cargo Registry
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.target }}

      - name: Stage naev-soundtrack
        run: |
          mkdir -p "handoff/naev-soundtrack"
          cp -r build/staging/naev-soundtrack/naev-*-soundtrack.zip "handoff/naev-soundtrack/"

      - name: Save naev-soundtrack
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-soundtrack
          key: naev-soundtrack-${{ github.run_id }}

      - name: Stage naev-steam-soundtrack
        run: |
          mkdir -p "handoff/naev-steam-soundtrack"
          cp -r build/staging/naev-steam-soundtrack/. "handoff/naev-steam-soundtrack/"

      - name: Save naev-steam-soundtrack
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-steam-soundtrack
          key: naev-steam-soundtrack-${{ github.run_id }}

  "Upload_Naev_Release":
    strategy:
      fail-fast: true
      matrix:
        include:
          - releasetype: codeberg
          - releasetype: steam
          - releasetype: itch

    runs-on: naev-release
    needs:
      [
        Package_Source,
        Linux_Naev_Release,
        Windows_Naev_Release,
        Darwin_Naev_Release,
        Steam_Naev_Soundtrack_Release,
      ]
    if: ${{ github.repository == 'naev/naev' }}

    steps:
      - name: Download Deployment Assets
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-deployment-assets
          key: naev-deployment-assets-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-deployment-assets
        run: |
          mkdir -p "build/staging/naev-deployment-assets"
          cp -r "handoff/naev-deployment-assets/." "build/staging/naev-deployment-assets/"

      - name: Download Version (codeberg/itch)
        if: ${{ matrix.releasetype == 'codeberg' || matrix.releasetype == 'itch' }}
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-version
          key: naev-version-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-version
        if: ${{ matrix.releasetype == 'codeberg' || matrix.releasetype == 'itch' }}
        run: |
          mkdir -p "build/staging/naev-version"
          cp -r "handoff/naev-version/." "build/staging/naev-version/"

      - name: Download Changelog (codeberg)
        if: ${{ matrix.releasetype == 'codeberg' }}
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-changelog
          key: naev-changelog-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-changelog
        if: ${{ matrix.releasetype == 'codeberg' }}
        run: |
          mkdir -p "build/staging/naev-changelog"
          cp -r "handoff/naev-changelog/." "build/staging/naev-changelog/"

      - name: Download Source Tarball (codeberg)
        if: ${{ matrix.releasetype == 'codeberg' }}
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-dist
          key: naev-dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-dist
        if: ${{ matrix.releasetype == 'codeberg' }}
        run: |
          mkdir -p "build/staging/naev-dist"
          cp -r "handoff/naev-dist/." "build/staging/naev-dist/"

      - name: Download Linux Package (codeberg/itch)
        if: ${{ matrix.releasetype == 'codeberg' || matrix.releasetype == 'itch' }}
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-linux-x86-64
          key: naev-linux-x86-64-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-linux-x86-64
        if: ${{ matrix.releasetype == 'codeberg' || matrix.releasetype == 'itch' }}
        run: |
          mkdir -p "build/staging/naev-linux-x86-64"
          cp -r "handoff/naev-linux-x86-64/." "build/staging/naev-linux-x86-64/"

      - name: Download Windows Installer (codeberg)
        if: ${{ matrix.releasetype == 'codeberg' }}
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-win64-installer
          key: naev-win64-installer-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-win64-installer
        if: ${{ matrix.releasetype == 'codeberg' }}
        run: |
          mkdir -p "build/staging/naev-win64"
          cp -r "handoff/naev-win64-installer/." "build/staging/naev-win64/"

      - name: Download Windows Tarball (itch)
        if: ${{ matrix.releasetype == 'itch' }}
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-win64-tarball
          key: naev-win64-tarball-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-win64-tarball
        if: ${{ matrix.releasetype == 'itch' }}
        run: |
          mkdir -p "build/staging/naev-win64"
          cp -r "handoff/naev-win64-tarball/." "build/staging/naev-win64/"

      - name: Download macOS Package (codeberg/itch/steam)
        if: ${{ matrix.releasetype == 'codeberg' || matrix.releasetype == 'itch' || matrix.releasetype == 'steam' }}
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-macos
          key: naev-macos-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-macos
        if: ${{ matrix.releasetype == 'codeberg' || matrix.releasetype == 'itch' || matrix.releasetype == 'steam' }}
        run: |
          mkdir -p "build/staging/naev-macos"
          cp -r "handoff/naev-macos/." "build/staging/naev-macos/"

      - name: Download Soundtrack (codeberg/itch)
        if: ${{ matrix.releasetype == 'codeberg' || matrix.releasetype == 'itch' }}
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-soundtrack
          key: naev-soundtrack-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-soundtrack
        if: ${{ matrix.releasetype == 'codeberg' || matrix.releasetype == 'itch' }}
        run: |
          mkdir -p "build/staging/naev-soundtrack"
          cp -r "handoff/naev-soundtrack/." "build/staging/naev-soundtrack/"

      - name: Download NDATA (itch/steam)
        if: ${{ matrix.releasetype == 'itch' || matrix.releasetype == 'steam' }}
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-ndata
          key: naev-ndata-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-ndata
        if: ${{ matrix.releasetype == 'itch' || matrix.releasetype == 'steam' }}
        run: |
          mkdir -p "build/staging/naev-ndata"
          cp -r "handoff/naev-ndata/." "build/staging/naev-ndata/"

      - name: Download Steam Runtime Binary (steam)
        if: ${{ matrix.releasetype == 'steam' }}
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-steamruntime
          key: naev-steamruntime-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-steamruntime
        if: ${{ matrix.releasetype == 'steam' }}
        run: |
          mkdir -p "build/staging/naev-steamruntime"
          cp -r "handoff/naev-steamruntime/." "build/staging/naev-steamruntime/"

      - name: Download Steam Runtime Libraries (steam)
        if: ${{ matrix.releasetype == 'steam' }}
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-linux-libs
          key: naev-linux-libs-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-linux-libs
        if: ${{ matrix.releasetype == 'steam' }}
        run: |
          mkdir -p "build/staging/naev-linux-libs"
          cp -r "handoff/naev-linux-libs/." "build/staging/naev-linux-libs/"

      - name: Download Steam Windows Package (steam)
        if: ${{ matrix.releasetype == 'steam' }}
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-win64-tarball
          key: naev-win64-tarball-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-win64-tarball
        if: ${{ matrix.releasetype == 'steam' }}
        run: |
          mkdir -p "build/staging/naev-win64"
          cp -r "handoff/naev-win64-tarball/." "build/staging/naev-win64/"

      - name: Download Steam Soundtrack (steam)
        if: ${{ matrix.releasetype == 'steam' }}
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-steam-soundtrack
          key: naev-steam-soundtrack-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-steam-soundtrack
        if: ${{ matrix.releasetype == 'steam' }}
        run: |
          mkdir -p "build/staging/naev-steam-soundtrack"
          cp -r "handoff/naev-steam-soundtrack/." "build/staging/naev-steam-soundtrack/"

      - name: Force Codeberg over SSH
        run: git config --global url."ssh://git@codeberg.org/naev/".insteadOf https://codeberg.org/naev/
        if: ${{ matrix.releasetype == 'codeberg' }}

      - name: Checkout Naev Repository
        if: ${{ matrix.releasetype == 'codeberg' }}
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false
          path: build/staging/repo
          ssh-key: ${{ secrets.CODEBERG_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.CODEBERG_SSH_KNOWN_HOSTS }}
          persist-credentials: true

      - name: Generate Changelog
        if: ${{ matrix.releasetype == 'codeberg' }}
        working-directory: ${{ github.workspace }}/build/staging/repo
        run: |
          ./utils/ci/generate_release_notes.sh \
            --mode changelog \
            --tag "${{ github.ref_name }}" \
            --changelog "${GITHUB_WORKSPACE}/build/staging/naev-changelog/Changelog.md" \
            --output "${GITHUB_WORKSPACE}/build/staging/release_notes.md"

      - name: Stage Codeberg Release
        if: ${{ matrix.releasetype == 'codeberg' }}
        run: |
          chmod -R +x build/staging/naev-deployment-assets/berg
          cp -r build/staging/naev-deployment-assets/berg/* "$(pwd)"
          ./BergDeploy.sh -t "$(pwd)/build/staging" -o "$(pwd)/build/dist" -r "${{ github.ref_name }}"

      - name: Upload Codeberg Release
        if: ${{ matrix.releasetype == 'codeberg' }}
        working-directory: ${{ github.workspace }}/build/staging/repo
        run: |
          ./utils/ci/upload_forgejo_release.py \
            --tag "${{ github.ref_name }}" \
            --notes-file "${GITHUB_WORKSPACE}/build/staging/release_notes.md" \
            --asset-dir "${GITHUB_WORKSPACE}/build/dist" \
            --overwrite \
            --hide-archive-link \
            --owner naev \
            --repo naev \
            --api-url https://codeberg.org/api/v1
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The downloads page lists Codeberg's releases as of the last website build.
      - name: Trigger Website Build
        if: ${{ matrix.releasetype == 'codeberg' }}
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.WEBSITE_TOKEN }}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "https://codeberg.org/api/v1/repos/naev/naev-website/actions/workflows/website_build.yml/dispatches" \
            -d '{"ref": "main"}'

      - name: Build and Upload itch.io Release
        if: ${{ matrix.releasetype == 'itch' }}
        run: |
          mv build/staging/naev-deployment-assets/itch build/staging/naev-itch-deployment
          chmod -R +x build/staging/naev-itch-deployment
          cp -r build/staging/naev-itch-deployment/. "$(pwd)"
          ./ItchDeploy.sh -t "$(pwd)/build/staging" -o "$(pwd)/build/dist"
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

      - name: Build and Upload Steam Release
        if: ${{ matrix.releasetype == 'steam' }}
        run: |
          chmod -R +x build/staging/naev-deployment-assets/steam
          cp -r build/staging/naev-deployment-assets/steam/* "$(pwd)"
          ./SteamDeploy.sh -t "$(pwd)/build/staging" -o "$(pwd)/build/dist"
        env:
          STEAMCMD_USER: ${{ secrets.STEAMCMD_USER }}
          STEAMCMD_PASS: ${{ secrets.STEAMCMD_PASS }}
          TFA_IMAP: ${{ secrets.TFA_IMAP }}
          TFA_PASS: ${{ secrets.TFA_PASS }}
          TFA_USER: ${{ secrets.TFA_USER }}
