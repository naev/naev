on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "nightly"
      - "v*.*.*"
      - "v*.*.*-alpha*"
      - "v*.*.*-beta*"
      - "v*.*.*-rc*"

name: CI

jobs:
  "Package_Source":
    runs-on: naev-release
    steps:
      - name: Force Codeberg over SSH
        run: git config --global url."ssh://git@codeberg.org/naev/".insteadOf https://codeberg.org/naev/

      - name: Checkout Naev Repository
        uses: actions/checkout@v4
        with:
          lfs: false # defer LFS to after cache restore
          path: source
          submodules: true
          ssh-key: ${{ secrets.CODEBERG_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.CODEBERG_SSH_KNOWN_HOSTS }}
          persist-credentials: true

      - name: Capture assets submodule revision
        id: assets_rev
        run: echo "rev=$(git -C source submodule status assets | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore LFS cache
        uses: actions/cache@v5
        with:
          path: |
            source/.git/lfs/objects
            source/.git/modules/assets/lfs/objects
          key: lfs-${{ steps.assets_rev.outputs.rev }}
          restore-keys: lfs-

      - name: Fetch and checkout LFS
        run: |
          git -C source/assets lfs fetch
          git -C source/assets lfs checkout

      - name: Package Dist
        run: |
          meson setup build source -Dexecutable=disabled -Ddocs_c=disabled -Ddocs_lua=disabled --wrap-mode=forcefallback
          meson dist -C build --no-tests --include-subprojects

      # Handed over through the cache server every runner shares, so the
      # tarball stays on the runner's network.
      - name: Save Dist
        uses: actions/cache/save@v5
        with:
          path: build/meson-dist
          key: naev-dist-${{ github.run_id }}

  "Linux_Compile_Naev":
    needs: "Package_Source"
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: naev-steamruntime
            config: linux_steamruntime.ini
            wrap_mode: default
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.image }}

    steps:
      # The runner's read-only cache credentials override any workflow or job
      # env, but not values a step writes to GITHUB_ENV.
      - name: Use the Trusted Compile Cache
        run: |
          echo "SCCACHE_REDIS_USERNAME=naev-trusted" >> "$GITHUB_ENV"
          echo "SCCACHE_REDIS_PASSWORD=${{ secrets.SCCACHE_TRUSTED_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SCCACHE_REDIS_RW_MODE=READ_WRITE" >> "$GITHUB_ENV"

      - name: Get Source
        uses: actions/cache/restore@v5
        with:
          path: build/meson-dist
          key: naev-dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Extract Source
        run: |
          mkdir source
          tar -xf build/meson-dist/naev-*.tar.xz -C source --strip 1

      - name: Restore Cargo Registry
        uses: actions/cache/restore@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.target }}

      - name: Meson Setup
        id: setup
        run: |
          meson setup build source \
              --native-file='source/utils/build/${{ matrix.config }}' \
              --buildtype=debug \
              --wrap-mode=${{ matrix.wrap_mode }} \
              -Dsteamruntime=false \
              -Dprefix="/usr" \
              -Dinstaller=false \
              -Db_lto=false \
              -Dauto_features=enabled \
              -Ddocs_c=disabled \
              -Ddocs_lua=disabled

      - name: Upload Setup Log
        uses: actions/upload-artifact@v3
        if: ${{ success() || steps.setup.outcome == 'failure' }}
        with:
          name: ${{ matrix.image }}-${{ github.sha }}-setup-log
          path: ${{ github.workspace }}/build/meson-logs/meson-log.txt

      - name: Meson Compile
        id: compile
        run: |
          meson compile -C build

      # One fixed key per platform. The cache server keeps only the newest
      # save of a key, so main refreshes it without piling up copies.
      - name: Save Cargo Registry
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.target }}

      - name: Meson Test (luacheck)
        id: luacheck
        run: |
          meson test luacheck -C build

      - name: Upload Compile Log
        uses: actions/upload-artifact@v3
        if: ${{ success() || steps.compile.outcome == 'failure' }}
        with:
          name: ${{ matrix.image }}-${{ github.sha }}-compile-log
          path: ${{ github.workspace }}/build/meson-logs/meson-log.txt

      - name: Upload Luacheck Log
        uses: actions/upload-artifact@v3
        if: ${{ success() || steps.luacheck.outcome == 'failure' }}
        with:
          name: ${{ matrix.image }}-${{ github.sha }}-luacheck-log
          path: ${{ github.workspace }}/build/meson-logs/testlog.txt

      - name: Test Install
        id: install
        run: |
          meson install -C build
        env:
          DESTDIR: "${{ github.workspace }}/staging"

      - name: Upload Install Log
        uses: actions/upload-artifact@v3
        if: ${{ success() || steps.install.outcome == 'failure' }}
        with:
          name: ${{ matrix.image }}-${{ github.sha }}-install-log
          path: ${{ github.workspace }}/build/meson-logs/meson-log.txt

      - name: Restore Cargo Registry
        uses: actions/cache/restore@v5
        with:
          path: |
            appImageBuild/builddir/cargo-home/registry/index
            appImageBuild/builddir/cargo-home/registry/cache
            appImageBuild/builddir/cargo-home/git/db
          key: cargo-registry-appimage-${{ matrix.image }}-${{ matrix.target }}

      - name: Compile AppImage
        id: appimageCompile
        run: |
          ./source/utils/buildAppImage.sh -c -d -i -s source -b appImageBuild | tee appImageBuildLog.txt

      - name: Save Cargo Registry
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: |
            appImageBuild/builddir/cargo-home/registry/index
            appImageBuild/builddir/cargo-home/registry/cache
            appImageBuild/builddir/cargo-home/git/db
          key: cargo-registry-appimage-${{ matrix.image }}-${{ matrix.target }}

      - name: Show sccache Stats
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$RUSTC_WRAPPER" ]; then "$RUSTC_WRAPPER" --show-stats; fi

      - name: Upload AppImage Compile Log
        uses: actions/upload-artifact@v3
        if: ${{ (success() || steps.appimageCompile.outcome == 'failure') }}
        with:
          name: ${{ matrix.image }}-${{ github.sha }}-AppImageBuild-log
          path: ${{ github.workspace }}/appImageBuildLog.txt

  "Windows_Compile_Naev":
    needs: "Package_Source"

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: naev-windows
            config: windows_cross_mingw.ini
            target: x86_64-pc-windows-gnu

    runs-on: ${{ matrix.image }}
    steps:
      # The runner's read-only cache credentials override any workflow or job
      # env, but not values a step writes to GITHUB_ENV.
      - name: Use the Trusted Compile Cache
        run: |
          echo "SCCACHE_REDIS_USERNAME=naev-trusted" >> "$GITHUB_ENV"
          echo "SCCACHE_REDIS_PASSWORD=${{ secrets.SCCACHE_TRUSTED_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SCCACHE_REDIS_RW_MODE=READ_WRITE" >> "$GITHUB_ENV"

      - name: Configure Build Environment
        run: |
          /usr/bin/setup-devenv.sh

      - name: Get Source
        uses: actions/cache/restore@v5
        with:
          path: build/meson-dist
          key: naev-dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Extract Source
        run: |
          mkdir source
          tar -xf build/meson-dist/naev-*.tar.xz -C source --strip 1

      - name: Restore Cargo Registry
        uses: actions/cache/restore@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.target }}

      - name: Meson Setup
        id: setup
        run: |
          meson setup build source \
              --prefix="$(pwd)"/source/extras/windows/installer \
              --bindir=bin \
              -Dndata_path=bin \
              --cross-file='source/utils/build/${{ matrix.config }}' \
              --native-file='source/utils/build/linux.ini' \
              --buildtype=debug \
              --wrap-mode=nopromote \
              -Dinstaller=false \
              -Drelease=false \
              -Db_lto=false \
              -Dauto_features=enabled \
              -Ddocs_c=disabled \
              -Ddocs_lua=disabled

      - name: Upload Setup Log
        uses: actions/upload-artifact@v3
        if: ${{ success() || steps.setup.outcome == 'failure' }}
        with:
          name: ${{ matrix.image }}-${{ github.sha }}-setup-log
          path: ${{ github.workspace }}/build/meson-logs/meson-log.txt

      - name: Meson Compile
        id: compile
        run: |
          meson compile -C build

      - name: Save Cargo Registry
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.target }}

      - name: Show sccache Stats
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$RUSTC_WRAPPER" ]; then "$RUSTC_WRAPPER" --show-stats; fi

      - name: Upload Compile Log
        uses: actions/upload-artifact@v3
        if: ${{ success() || steps.compile.outcome == 'failure' }}
        with:
          name: ${{ matrix.image }}-${{ github.sha }}-compile-log
          path: ${{ github.workspace }}/build/meson-logs/meson-log.txt

      - name: Test Install
        id: install
        run: |
          meson install -C build

      - name: Upload Install Log
        uses: actions/upload-artifact@v3
        if: ${{ success() || steps.install.outcome == 'failure' }}
        with:
          name: ${{ matrix.image }}-${{ github.sha }}-install-log
          path: ${{ github.workspace }}/build/meson-logs/meson-log.txt

  "Darwin_Compile_Naev":
    needs: "Package_Source"

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: naev-macos
            arch: x86_64
            config: macos_cross_osxcross.ini
          - image: naev-macos
            arch: aarch64
            config: macos_aarch64_cross_osxcross.ini

    runs-on: ${{ matrix.image }}
    env:
      BUILDARCH: "${{ matrix.arch }}"

    steps:
      # The runner's read-only cache credentials override any workflow or job
      # env, but not values a step writes to GITHUB_ENV.
      - name: Use the Trusted Compile Cache
        run: |
          echo "SCCACHE_REDIS_USERNAME=naev-trusted" >> "$GITHUB_ENV"
          echo "SCCACHE_REDIS_PASSWORD=${{ secrets.SCCACHE_TRUSTED_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SCCACHE_REDIS_RW_MODE=READ_WRITE" >> "$GITHUB_ENV"

      - name: Configure Build Environment
        run: |
          /usr/bin/setup-devenv.sh

      - name: Get Source
        uses: actions/cache/restore@v5
        with:
          path: build/meson-dist
          key: naev-dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Extract Source
        run: |
          mkdir source
          tar -xf build/meson-dist/naev-*.tar.xz -C source --strip 1

      - name: Restore Cargo Registry
        uses: actions/cache/restore@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.arch }}

      - name: Meson Setup
        id: setup
        run: |
          meson setup build source \
              --prefix="$(pwd)"/build/dist/Naev.app \
              --bindir=Contents/MacOS \
              --libdir=Contents/Frameworks \
              -Dndata_path=Contents/Resources \
              --cross-file='source/utils/build/${{ matrix.config }}' \
              --native-file='source/utils/build/linux.ini' \
              --buildtype=debug \
              -Dinstaller=false \
              -Drelease=false \
              -Db_lto=false \
              -Dauto_features=enabled \
              -Ddocs_c=disabled \
              -Ddocs_lua=disabled


      - name: Upload Setup Log
        uses: actions/upload-artifact@v3
        if: ${{ success() || steps.setup.outcome == 'failure' }}
        with:
          name: ${{ matrix.image }}.${{ matrix.arch }}-${{ github.sha }}-setup-log
          path: ${{ github.workspace }}/build/meson-logs/meson-log.txt

      - name: Meson Compile
        id: compile
        run: |
          meson compile -C build

      - name: Save Cargo Registry
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.arch }}

      - name: Show sccache Stats
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$RUSTC_WRAPPER" ]; then "$RUSTC_WRAPPER" --show-stats; fi

      - name: Upload Compile Log
        uses: actions/upload-artifact@v3
        if: ${{ success() || steps.compile.outcome == 'failure' }}
        with:
          name: ${{ matrix.image }}.${{ matrix.arch }}-${{ github.sha }}-compile-log
          path: ${{ github.workspace }}/build/meson-logs/meson-log.txt

      - name: Test Install
        id: install
        run: |
          meson install -C build

      - name: Upload Install Log
        uses: actions/upload-artifact@v3
        if: ${{ success() || steps.install.outcome == 'failure' }}
        with:
          name: ${{ matrix.image }}.${{ matrix.arch }}-${{ github.sha }}-install-log
          path: ${{ github.workspace }}/build/meson-logs/meson-log.txt

  "Documentation":
    runs-on: naev-docs
    needs:
      [
        Linux_Compile_Naev,
        Windows_Compile_Naev,
        Darwin_Compile_Naev,
      ]

    steps:
      - name: Get Source
        uses: actions/cache/restore@v5
        with:
          path: build/meson-dist
          key: naev-dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Extract Source
        run: |
          mkdir source
          tar -xf build/meson-dist/naev-*.tar.xz -C source --strip 1

      - name: Meson Setup
        run: |
          meson setup build source \
              -Dexecutable=disabled

      - name: Meson Compile
        id: compile
        run: |
          meson compile -C build
          meson compile -C build manual

      - name: Upload Compile Log
        uses: actions/upload-artifact@v3
        if: ${{ steps.compile.outcome == 'failure' }}
        with:
          name: ${{ github.sha }}-ldoc-log
          path: ${{ github.workspace }}/build/meson-logs/meson-log.txt

      - name: Trigger Website Build
        if: ${{ steps.compile.outcome == 'success' && github.ref == 'refs/heads/main' }}
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.WEBSITE_TOKEN }}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "https://codeberg.org/api/v1/repos/naev/naev-website/actions/workflows/api_build.yml/dispatches" \
            -d '{"ref": "main"}'
