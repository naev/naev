on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

name: Nightly Release

# The runner's own credentials only read the shared compile cache. Builds
# from this repository write to it with a secret pull requests never get.
env:
  SCCACHE_REDIS_USERNAME: naev-trusted
  SCCACHE_REDIS_PASSWORD: ${{ secrets.SCCACHE_TRUSTED_PASSWORD }}
  SCCACHE_REDIS_RW_MODE: READ_WRITE

jobs:
  "Nightly_Skip_Check":
    runs-on: naev-release
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Force Codeberg over SSH
        run: git config --global url."ssh://git@codeberg.org/naev/".insteadOf https://codeberg.org/naev/

      - name: Checkout Naev Repository
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false
          ssh-key: ${{ secrets.CODEBERG_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.CODEBERG_SSH_KNOWN_HOSTS }}
          persist-credentials: true

      - name: Check for new commits since last nightly
        id: check
        run: |
          # 'nightly' is a lightweight tag, so its target is the commit the
          # last build ran on. Fetching every tag would drag in the history.
          git fetch --depth=1 origin +refs/tags/nightly:refs/tags/nightly || true
          current_sha="$(git rev-parse HEAD)"
          nightly_sha="$(git rev-parse nightly 2>/dev/null || true)"

          if [[ -n "${nightly_sha}" && "${current_sha}" == "${nightly_sha}" ]]; then
            echo "No new commits since last nightly (${current_sha}); skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  "Package_Source":
    needs: "Nightly_Skip_Check"
    if: ${{ needs.Nightly_Skip_Check.outputs.skip != 'true' }}
    runs-on: naev-release
    steps:
      - name: Force Codeberg over SSH
        run: git config --global url."ssh://git@codeberg.org/naev/".insteadOf https://codeberg.org/naev/

      - name: Checkout Naev Repository
        uses: actions/checkout@v4
        with:
          lfs: false # restore after cache
          path: source
          submodules: true
          ssh-key: ${{ secrets.CODEBERG_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.CODEBERG_SSH_KNOWN_HOSTS }}
          persist-credentials: true

      - name: Capture assets submodule revision
        id: assets_rev
        run: echo "rev=$(git -C source submodule status assets | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore LFS cache
        uses: actions/cache@v5
        with:
          path: |
            source/.git/lfs/objects
            source/.git/modules/assets/lfs/objects
          key: lfs-${{ steps.assets_rev.outputs.rev }}
          restore-keys: lfs-

      - name: Fetch and checkout LFS
        run: |
          git -C source/assets lfs fetch
          git -C source/assets lfs checkout

      - name: Package Dist
        run: |
          meson setup build source -Dexecutable=disabled -Ddocs_c=disabled -Ddocs_lua=disabled --wrap-mode=forcefallback
          meson dist -C build --no-tests --include-subprojects

      - name: Collect Artifacts
        run: |
          mkdir -p build/dist
          cp -r source/utils/ci/itch source/utils/ci/steam source/utils/ci/berg build/dist/
          cp source/utils/buildUniversalBundle.sh build/dist
          cp -r source/extras/macos/dmg_assets build/dist
          cp source/extras/macos/entitlements.plist build/dist
          mv build/meson-dist/naev-*.tar.xz build/dist/source.tar.xz
          cp source/dat/VERSION build/dist

      # Build outputs pass between jobs through the cache server every
      # runner shares, laid out the way an artifact download placed them.
      - name: Stage naev-dist
        run: |
          mkdir -p "handoff/naev-dist"
          cp -r "build/dist/source.tar.xz" "handoff/naev-dist/"

      - name: Save naev-dist
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-dist
          key: naev-dist-${{ github.run_id }}

      - name: Stage naev-version
        run: |
          mkdir -p "handoff/naev-version"
          cp -r "build/dist/VERSION" "handoff/naev-version/"

      - name: Save naev-version
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-version
          key: naev-version-${{ github.run_id }}

      - name: Stage naev-packaging-assets
        run: |
          mkdir -p "handoff/naev-packaging-assets"
          cp -r "build/dist/buildUniversalBundle.sh" "handoff/naev-packaging-assets/"
          cp -r "build/dist/dmg_assets" "handoff/naev-packaging-assets/"
          cp -r "build/dist/entitlements.plist" "handoff/naev-packaging-assets/"

      - name: Save naev-packaging-assets
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-packaging-assets
          key: naev-packaging-assets-${{ github.run_id }}

      - name: Stage naev-deployment-assets
        run: |
          mkdir -p "handoff/naev-deployment-assets"
          cp -r "build/dist/berg" "handoff/naev-deployment-assets/"
          cp -r "build/dist/steam" "handoff/naev-deployment-assets/"
          cp -r "build/dist/itch" "handoff/naev-deployment-assets/"

      - name: Save naev-deployment-assets
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-deployment-assets
          key: naev-deployment-assets-${{ github.run_id }}

  "Linux_Naev_Release":
    needs: "Package_Source"
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: naev-steamruntime
            config: linux_steamruntime.ini
            wrap_mode: default
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.image }}

    steps:
      - name: Get Source
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-dist
          key: naev-dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-dist
        run: |
          cp -r "handoff/naev-dist/." "./"

      - name: Extract Source
        run: |
          mkdir source
          tar -xf source.tar.xz -C source --strip 1

      - name: Restore Cargo Registry
        uses: actions/cache/restore@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.target }}

      - name: Meson Setup
        run: |
          meson setup build source \
              --native-file='source/utils/build/linux_steamruntime.ini' \
              --buildtype=debug \
              --wrap-mode=${{ matrix.wrap_mode }} \
              -Dsteamruntime=true \
              -Dprefix="/usr" \
              -Dinstaller=true \
              -Db_lto=false \
              -Dauto_features=enabled \
              -Ddocs_c=disabled \
              -Ddocs_lua=disabled

      - name: Meson Compile
        run: |
          meson compile -C build

      - name: Save Cargo Registry
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.target }}

      - name: Show sccache Stats
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$RUSTC_WRAPPER" ]; then "$RUSTC_WRAPPER" --show-stats; fi

      - name: Upload Cargo Lock Artifact
        uses: actions/upload-artifact@v3
        with:
          name: naev-${{ matrix.target }}-cargo-lock
          path: ${{ github.workspace }}/build/Cargo.lock
          if-no-files-found: error

      - name: Meson Install
        run: |
          meson install -C build
        env:
          DESTDIR: ${{ github.workspace }}/staging

      - name: Build AppImage
        run: |
          DESTDIR="${{ github.workspace }}/AppDir" meson install -C build
          ./source/utils/buildAppImage.sh -d -n -e -i -a "${{ github.workspace }}/AppDir" -s source -b appimage

      - name: Collect Steam Linux64 Artifacts
        run: |
          mkdir -p build/dist/ build/libs/

          mv staging/usr/bin/naev build/dist/naev.x64
          chmod +x build/dist/naev.x64

          # Steam's runtime supplies the rest of what linuxdeploy bundled.
          cp AppDir/usr/lib/libopenal.so.1 AppDir/usr/lib/libluajit-5.1.so.2 build/libs/

          tar -cJf build/dist/naev-ndata.tar.xz -C staging/usr/share/naev dat

      - name: Stage naev-steamruntime
        run: |
          mkdir -p "handoff/naev-steamruntime"
          cp -r "build/dist/naev.x64" "handoff/naev-steamruntime/"

      - name: Save naev-steamruntime
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-steamruntime
          key: naev-steamruntime-${{ github.run_id }}

      - name: Stage naev-ndata
        run: |
          mkdir -p "handoff/naev-ndata"
          cp -r "build/dist/naev-ndata.tar.xz" "handoff/naev-ndata/"

      - name: Save naev-ndata
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-ndata
          key: naev-ndata-${{ github.run_id }}

      - name: Stage naev-linux-libs
        run: |
          mkdir -p "handoff/naev-linux-libs"
          cp -r "build/libs/". "handoff/naev-linux-libs/"

      - name: Save naev-linux-libs
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-linux-libs
          key: naev-linux-libs-${{ github.run_id }}

      - name: Stage naev-linux-x86-64
        run: |
          mkdir -p "handoff/naev-linux-x86-64"
          cp -r appimage/dist/* "handoff/naev-linux-x86-64/"

      - name: Save naev-linux-x86-64
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-linux-x86-64
          key: naev-linux-x86-64-${{ github.run_id }}

  "Windows_Naev_Release":
    needs: "Package_Source"

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: naev-windows
            config: windows_cross_mingw.ini
            target: x86_64-pc-windows-gnu

    runs-on: ${{ matrix.image }}
    steps:
      - name: Configure Build Environment
        run: |
          /usr/bin/setup-devenv.sh

      - name: Get Source
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-dist
          key: naev-dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-dist
        run: |
          cp -r "handoff/naev-dist/." "./"

      - name: Extract Source
        run: |
          mkdir source
          tar -xf source.tar.xz -C source --strip 1

      - name: Restore Cargo Registry
        uses: actions/cache/restore@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.target }}

      - name: Meson Setup
        # We disable b_lto here because it messes with backtraces on windows
        run: |
          meson setup build source \
              --prefix="$(pwd)"/source/extras/windows/installer \
              --bindir=. \
              -Dndata_path=. \
              --cross-file='source/utils/build/${{ matrix.config }}' \
              --native-file='source/utils/build/linux.ini' \
              --buildtype=debug \
              --wrap-mode=nopromote \
              -Dinstaller=true \
              -Drelease=true \
              -Db_lto=false \
              -Dauto_features=enabled \
              -Ddocs_c=disabled \
              -Ddocs_lua=disabled

      - name: Meson Compile
        run: |
          meson compile -C build

      - name: Save Cargo Registry
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.target }}

      - name: Show sccache Stats
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$RUSTC_WRAPPER" ]; then "$RUSTC_WRAPPER" --show-stats; fi

      - name: Meson Install
        run: |
          meson install -C build

      - name: Stage naev-win64-installer
        run: |
          mkdir -p "handoff/naev-win64-installer"
          cp -r "build/dist/naev-installer.exe" "handoff/naev-win64-installer/"

      - name: Save naev-win64-installer
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-win64-installer
          key: naev-win64-installer-${{ github.run_id }}

      - name: Stage naev-win64-tarball
        run: |
          mkdir -p "handoff/naev-win64-tarball"
          cp -r "build/dist/naev-windows.tar.xz" "handoff/naev-win64-tarball/"

      - name: Save naev-win64-tarball
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-win64-tarball
          key: naev-win64-tarball-${{ github.run_id }}

  "Darwin_Compile_Naev":
    needs: "Package_Source"

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: naev-macos
            arch: x86_64
            config: macos_cross_osxcross.ini
            binaries_only: "1"
          - image: naev-macos
            arch: aarch64
            config: macos_aarch64_cross_osxcross.ini
            binaries_only: "0"

    runs-on: ${{ matrix.image }}
    env:
      BUILDARCH: "${{ matrix.arch }}"
    steps:
      - name: Configure Build Environment
        run: |
          /usr/bin/setup-devenv.sh

      - name: Get Source
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-dist
          key: naev-dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-dist
        run: |
          cp -r "handoff/naev-dist/." "./"

      - name: Extract Source
        run: |
          mkdir source
          tar -xf source.tar.xz -C source --strip 1

      - name: Restore Cargo Registry
        uses: actions/cache/restore@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.arch }}

      - name: Meson Setup
        run: |
          meson setup build source \
              --prefix="$(pwd)"/build/macos/Naev.app \
              --bindir=Contents/MacOS \
              --libdir=Contents/Frameworks \
              -Dndata_path=Contents/Resources \
              --cross-file='source/utils/build/${{ matrix.config }}' \
              --native-file='source/utils/build/linux.ini' \
              --buildtype=debug \
              -Dinstaller=false \
              -Drelease=true \
              -Db_lto=false \
              -Dauto_features=enabled \
              -Ddocs_c=disabled \
              -Ddocs_lua=disabled

      - name: Meson Compile
        run: |
          meson compile -C build

      - name: Save Cargo Registry
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.arch }}

      - name: Show sccache Stats
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$RUSTC_WRAPPER" ]; then "$RUSTC_WRAPPER" --show-stats; fi

      - name: Meson Install
        run: |
          meson install -C build
        env:
          NAEV_BUNDLE_BINARIES_ONLY: ${{ matrix.binaries_only }}

      - name: Fix zip name
        run: |
          mv build/dist/naev-macos.zip build/dist/naev-macos-${{ matrix.arch }}.zip

      - name: Stage naev-macos-${{ matrix.arch }}
        run: |
          mkdir -p "handoff/naev-macos-${{ matrix.arch }}"
          cp -r "build/dist/naev-macos-${{ matrix.arch }}.zip" "handoff/naev-macos-${{ matrix.arch }}/"

      - name: Save naev-macos-${{ matrix.arch }}
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-macos-${{ matrix.arch }}
          key: naev-macos-${{ matrix.arch }}-${{ github.run_id }}

  "Darwin_Package_Release":
    needs:
      [
        Package_Source,
        Darwin_Compile_Naev
      ]
    runs-on: naev-macos

    steps:
      - name: Get Universal Bundle Packaging Script
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-packaging-assets
          key: naev-packaging-assets-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-packaging-assets
        run: |
          mkdir -p "packaging"
          cp -r "handoff/naev-packaging-assets/." "packaging/"

      - name: Get x86_64 macOS Bundle
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-macos-x86_64
          key: naev-macos-x86_64-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-macos-x86_64
        run: |
          cp -r "handoff/naev-macos-x86_64/." "./"

      - name: Get ARM64 macOS Bundle
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-macos-aarch64
          key: naev-macos-aarch64-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-macos-aarch64
        run: |
          cp -r "handoff/naev-macos-aarch64/." "./"

      - name: Package Universal Bundle
        run: |
              mkdir -p arm64 x86_64
              chmod +x packaging/buildUniversalBundle.sh
              unzip naev-macos-aarch64.zip -d arm64
              unzip naev-macos-x86_64.zip -d x86_64
              ./packaging/buildUniversalBundle.sh -d -i ./packaging/dmg_assets -e ./packaging/entitlements.plist -a ./arm64 -x ./x86_64 -b ./build

      - name: Stage naev-macos
        run: |
          mkdir -p "handoff/naev-macos"
          cp -r build/dist/* "handoff/naev-macos/"

      - name: Save naev-macos
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-macos
          key: naev-macos-${{ github.run_id }}

  "Upload_Naev_Release":
    strategy:
      fail-fast: false
      matrix:
        include:
          - releasetype: codeberg
          - releasetype: steam
          - releasetype: itch

    runs-on: naev-release
    needs:
      [
        Package_Source,
        Linux_Naev_Release,
        Windows_Naev_Release,
        Darwin_Package_Release,
      ]
    if: ${{ github.repository == 'naev/naev' }}

    steps:
      - name: Download Deployment Assets
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-deployment-assets
          key: naev-deployment-assets-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-deployment-assets
        run: |
          mkdir -p "build/staging/naev-deployment-assets"
          cp -r "handoff/naev-deployment-assets/." "build/staging/naev-deployment-assets/"

      - name: Download Version
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-version
          key: naev-version-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-version
        run: |
          mkdir -p "build/staging/naev-version"
          cp -r "handoff/naev-version/." "build/staging/naev-version/"

      - name: Download Source Tarball (codeberg)
        if: ${{ matrix.releasetype == 'codeberg' }}
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-dist
          key: naev-dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-dist
        if: ${{ matrix.releasetype == 'codeberg' }}
        run: |
          mkdir -p "build/staging/naev-dist"
          cp -r "handoff/naev-dist/." "build/staging/naev-dist/"

      - name: Download Linux Package (codeberg/itch)
        if: ${{ matrix.releasetype == 'codeberg' || matrix.releasetype == 'itch' }}
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-linux-x86-64
          key: naev-linux-x86-64-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-linux-x86-64
        if: ${{ matrix.releasetype == 'codeberg' || matrix.releasetype == 'itch' }}
        run: |
          mkdir -p "build/staging/naev-linux-x86-64"
          cp -r "handoff/naev-linux-x86-64/." "build/staging/naev-linux-x86-64/"

      - name: Download Windows Installer (codeberg)
        if: ${{ matrix.releasetype == 'codeberg' }}
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-win64-installer
          key: naev-win64-installer-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-win64-installer
        if: ${{ matrix.releasetype == 'codeberg' }}
        run: |
          mkdir -p "build/staging/naev-win64"
          cp -r "handoff/naev-win64-installer/." "build/staging/naev-win64/"

      - name: Download Windows Tarball (itch/steam)
        if: ${{ matrix.releasetype == 'itch' || matrix.releasetype == 'steam' }}
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-win64-tarball
          key: naev-win64-tarball-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-win64-tarball
        if: ${{ matrix.releasetype == 'itch' || matrix.releasetype == 'steam' }}
        run: |
          mkdir -p "build/staging/naev-win64"
          cp -r "handoff/naev-win64-tarball/." "build/staging/naev-win64/"

      - name: Download macOS Package
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-macos
          key: naev-macos-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-macos
        run: |
          mkdir -p "build/staging/naev-macos"
          cp -r "handoff/naev-macos/." "build/staging/naev-macos/"

      - name: Download NDATA (itch/steam)
        if: ${{ matrix.releasetype == 'itch' || matrix.releasetype == 'steam' }}
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-ndata
          key: naev-ndata-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-ndata
        if: ${{ matrix.releasetype == 'itch' || matrix.releasetype == 'steam' }}
        run: |
          mkdir -p "build/staging/naev-ndata"
          cp -r "handoff/naev-ndata/." "build/staging/naev-ndata/"

      - name: Download Steam Runtime Binary (steam)
        if: ${{ matrix.releasetype == 'steam' }}
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-steamruntime
          key: naev-steamruntime-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-steamruntime
        if: ${{ matrix.releasetype == 'steam' }}
        run: |
          mkdir -p "build/staging/naev-steamruntime"
          cp -r "handoff/naev-steamruntime/." "build/staging/naev-steamruntime/"

      - name: Download Steam Runtime Libraries (steam)
        if: ${{ matrix.releasetype == 'steam' }}
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-linux-libs
          key: naev-linux-libs-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Place naev-linux-libs
        if: ${{ matrix.releasetype == 'steam' }}
        run: |
          mkdir -p "build/staging/naev-linux-libs"
          cp -r "handoff/naev-linux-libs/." "build/staging/naev-linux-libs/"

      - name: Force Codeberg over SSH
        run: git config --global url."ssh://git@codeberg.org/naev/".insteadOf https://codeberg.org/naev/
        if: ${{ matrix.releasetype == 'codeberg' }}

      - name: Checkout Naev Repository
        if: ${{ matrix.releasetype == 'codeberg' }}
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false
          path: build/staging/repo
          fetch-depth: 0
          filter: blob:none
          ssh-key: ${{ secrets.CODEBERG_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.CODEBERG_SSH_KNOWN_HOSTS }}
          persist-credentials: true

      - name: Fetch previous nightly tag
        if: ${{ matrix.releasetype == 'codeberg' }}
        working-directory: ${{ github.workspace }}/build/staging/repo
        run: |
          git fetch --tags
          if git rev-parse nightly >/dev/null 2>&1; then
            echo "PREV_NIGHTLY_SHA=$(git rev-parse nightly)" >> $GITHUB_ENV
          fi

      - name: Generate Nightly Changelog
        if: ${{ matrix.releasetype == 'codeberg' }}
        working-directory: ${{ github.workspace }}/build/staging/repo
        run: |
          # Determine previous nightly SHA from tag (fallback to HEAD^)
          if [ -n "${PREV_NIGHTLY_SHA:-}" ]; then
            PREV_SHA="$PREV_NIGHTLY_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            PREV_SHA=$(git rev-parse HEAD^)
          else
            PREV_SHA=$(git rev-parse HEAD)
          fi

          build_date="$(date +%Y-%m-%d)"
          build_sha="$(git rev-parse HEAD)"
          repo_url="https://codeberg.org/naev/naev/commit"

          ./utils/ci/generate_release_notes.sh \
            --mode nightly \
            --repo-path "$(pwd)" \
            --prev-sha "${PREV_SHA}" \
            --build-sha "${build_sha}" \
            --build-date "${build_date}" \
            --repo-url "${repo_url}" \
            --output "${GITHUB_WORKSPACE}/build/staging/release_notes.md"

          echo "RELEASE_TITLE=Nightly Release (${build_date}, ${build_sha:0:7})" >> $GITHUB_ENV

      - name: Push 'nightly' tag
        if: ${{ matrix.releasetype == 'codeberg' }}
        working-directory: ${{ github.workspace }}/build/staging/repo
        run: |
          git config --local user.email "naevBuilder@emoss.ca"
          git config --local user.name "Naev Runner [bot]"
          git tag -f nightly
          git push --force origin nightly

      - name: Stage Codeberg Release
        if: ${{ matrix.releasetype == 'codeberg' }}
        run: |
          chmod -R +x build/staging/naev-deployment-assets/berg
          cp -r build/staging/naev-deployment-assets/berg/* "$(pwd)"
          ./BergDeploy.sh -n -t "$(pwd)/build/staging" -o "$(pwd)/build/dist" -r "nightly"

      - name: Upload Codeberg Release
        if: ${{ matrix.releasetype == 'codeberg' }}
        working-directory: ${{ github.workspace }}/build/staging/repo
        run: |
          ./utils/ci/upload_forgejo_release.py \
            --tag nightly \
            --title "${RELEASE_TITLE}" \
            --notes-file "${GITHUB_WORKSPACE}/build/staging/release_notes.md" \
            --asset-dir "${GITHUB_WORKSPACE}/build/dist" \
            --prerelease \
            --overwrite \
            --hide-archive-link \
            --owner naev \
            --repo naev \
            --api-url https://codeberg.org/api/v1
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Upload itch.io Release
        if: ${{ matrix.releasetype == 'itch' }}
        run: |
          mv build/staging/naev-deployment-assets/itch build/staging/naev-itch-deployment
          chmod -R +x build/staging/naev-itch-deployment
          cp -r build/staging/naev-itch-deployment/. "$(pwd)"
          ./ItchDeploy.sh -n -t "$(pwd)/build/staging" -o "$(pwd)/build/dist"
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

      - name: Build and Upload Steam Release
        if: ${{ matrix.releasetype == 'steam' }}
        run: |
          chmod -R +x build/staging/naev-deployment-assets/steam
          cp -r build/staging/naev-deployment-assets/steam/* "$(pwd)"
          ./SteamDeploy.sh -n -t "$(pwd)/build/staging" -o "$(pwd)/build/dist"
        env:
          STEAMCMD_USER: ${{ secrets.STEAMCMD_USER }}
          STEAMCMD_PASS: ${{ secrets.STEAMCMD_PASS }}
          TFA_IMAP: ${{ secrets.TFA_IMAP }}
          TFA_PASS: ${{ secrets.TFA_PASS }}
          TFA_USER: ${{ secrets.TFA_USER }}
