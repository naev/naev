on: [pull_request]

name: Pull Request Testing

jobs:
  "Package_Source":
    runs-on: naev-release
    steps:
      - name: Checkout Naev Repository
        uses: actions/checkout@v4
        with:
          lfs: false # defer LFS to after cache restore
          path: source
          submodules: true

      - name: Capture assets submodule revision
        id: assets_rev
        run: echo "rev=$(git -C source submodule status assets | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore LFS cache
        uses: actions/cache@v5
        with:
          path: |
            source/.git/lfs/objects
            source/.git/modules/assets/lfs/objects
          key: lfs-${{ steps.assets_rev.outputs.rev }}
          restore-keys: lfs-

      - name: Fetch and checkout LFS
        run: |
          # Strip any Actions-injected credentials so LFS falls back to
          # anonymous HTTPS (the assets repo is public).  Without this,
          # fork-PR runners send an invalid token and Codeberg rejects it.
          git -C source/assets config --unset-all "http.https://codeberg.org/.extraheader" || true
          git -C source config --unset-all "http.https://codeberg.org/.extraheader" || true
          git -C source/assets lfs fetch
          git -C source/assets lfs checkout

      - name: Restore Cargo Registry
        uses: actions/cache/restore@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-naev-release

      - name: Package Dist
        run: |
          cd source
          cargo xtask dist --output "${{ github.workspace }}/build/dist"
        env:
          CARGO_HOME: ${{ github.workspace }}/build/cargo-home
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/target

      # One fixed key per platform. The cache server keeps only the newest
      # save of a key, so main refreshes it without piling up copies.
      - name: Save Cargo Registry
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-naev-release

      - name: Collect Artifacts
        run: |
          mkdir -p handoff/naev-dist
          mv build/dist/naev-*.tar.xz handoff/naev-dist/source.tar.xz

      # Handed over through the cache server every runner shares, so the
      # tarball stays on the runner's network.
      - name: Save Dist
        uses: actions/cache/save@v5
        with:
          path: handoff/naev-dist
          key: naev-dist-${{ github.run_id }}

  "Linux_Compile_Naev":
    needs: "Package_Source"
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: naev-steamruntime
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.image }}
    env:
      CARGO_HOME: ${{ github.workspace }}/build/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/target
    steps:
      - name: Get Source
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-dist
          key: naev-dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Extract Source
        run: |
          mkdir source
          tar -xf handoff/naev-dist/source.tar.xz -C source --strip 1

      - name: Restore Cargo Registry
        uses: actions/cache/restore@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.target }}

      - name: Test Install
        run: |
          cd source
          cargo xtask install --destdir "${{ github.workspace }}/staging" --prefix /usr

      # One fixed key per platform. The cache server keeps only the newest
      # save of a key, so main refreshes it without piling up copies.
      - name: Save Cargo Registry
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.target }}

      - name: Test
        run: |
          cd source
          cargo test --workspace --profile release-with-debug

      # The same commands as the pre-commit hooks.
      - name: Lint
        run: |
          cd source
          utils/nluacheck.py dat --no-color
          appstreamcli validate --no-net --pedantic org.naev.Naev.metainfo.xml

      - name: Compile AppImage
        run: |
          cd source
          cargo xtask package appimage --no-compression --output "${{ github.workspace }}/build/staging"

      - name: Show sccache Stats
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$RUSTC_WRAPPER" ]; then "$RUSTC_WRAPPER" --show-stats; fi

  "Windows_Compile_Naev":
    needs: "Package_Source"
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: naev-windows
            target: x86_64-pc-windows-gnu

    runs-on: ${{ matrix.image }}
    env:
      CARGO_HOME: ${{ github.workspace }}/build/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/target
    steps:
      - name: Configure Build Environment
        run: |
          /usr/bin/setup-devenv.sh

      - name: Get Source
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-dist
          key: naev-dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Extract Source
        run: |
          mkdir source
          tar -xf handoff/naev-dist/source.tar.xz -C source --strip 1

      - name: Restore Cargo Registry
        uses: actions/cache/restore@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.target }}

      - name: Test Install
        run: |
          cd source
          cargo xtask install --target ${{ matrix.target }} --prefix "${{ github.workspace }}/staging" --bindir . --ndata-path .

      # One fixed key per platform. The cache server keeps only the newest
      # save of a key, so main refreshes it without piling up copies.
      - name: Save Cargo Registry
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.target }}

      - name: Show sccache Stats
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$RUSTC_WRAPPER" ]; then "$RUSTC_WRAPPER" --show-stats; fi

  "Darwin_Compile_Naev":
    needs: "Package_Source"
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: naev-macos
            arch: x86_64
          - image: naev-macos
            arch: aarch64

    runs-on: ${{ matrix.image }}
    env:
      CARGO_HOME: ${{ github.workspace }}/build/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/target
      BUILDARCH: "${{ matrix.arch }}"
    steps:
      - name: Configure Build Environment
        run: |
          /usr/bin/setup-devenv.sh

      - name: Get Source
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-dist
          key: naev-dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Extract Source
        run: |
          mkdir source
          tar -xf handoff/naev-dist/source.tar.xz -C source --strip 1

      - name: Restore Cargo Registry
        uses: actions/cache/restore@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.arch }}

      - name: Test Install
        run: |
          cd source
          cargo xtask install --target ${{ matrix.arch }}-apple-darwin --prefix "${{ github.workspace }}/build/dist/Naev.app" --bindir Contents/MacOS --ndata-path Contents/Resources

      # One fixed key per platform. The cache server keeps only the newest
      # save of a key, so main refreshes it without piling up copies.
      - name: Save Cargo Registry
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: |
            build/cargo-home/registry/index
            build/cargo-home/registry/cache
            build/cargo-home/git/db
          key: cargo-registry-${{ matrix.image }}-${{ matrix.arch }}

      - name: Show sccache Stats
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$RUSTC_WRAPPER" ]; then "$RUSTC_WRAPPER" --show-stats; fi

  "Documentation":
    runs-on: naev-docs
    needs:
      [
        Package_Source,
        Linux_Compile_Naev,
        Windows_Compile_Naev,
        Darwin_Compile_Naev,
      ]

    steps:
      - name: Get Source
        uses: actions/cache/restore@v5
        with:
          path: handoff/naev-dist
          key: naev-dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Extract Source
        run: |
          mkdir source
          tar -xf handoff/naev-dist/source.tar.xz -C source --strip 1

      - name: Build Documentation
        id: compile
        run: |
          cd source
          cargo xtask docs lua manual --output "${{ github.workspace }}/build/doc"
        env:
          CARGO_HOME: ${{ github.workspace }}/build/cargo-home
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/target

